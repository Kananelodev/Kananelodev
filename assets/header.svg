<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Kananelo Mofokeng — data engineer in the making, founder of FORGE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#16100c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#e2361b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: 2px; fill: url(#ember); }
      .sub { font-size: 18px; fill: #d9d2cc; }
      .dim { fill: #8a817a; }
      .tag { font-size: 13px; fill: #ff8a3d; letter-spacing: 3px; }
      .node rect { fill: #141010; stroke: #ff6a1a; stroke-opacity: 0.55; stroke-width: 1.5; }
      .node text { font-size: 14px; font-weight: 700; fill: #f4ece6; letter-spacing: 2px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .n1 rect { animation: lit 4s ease-in-out infinite 0s; }
      .n2 rect { animation: lit 4s ease-in-out infinite 1s; }
      .n3 rect { animation: lit 4s ease-in-out infinite 2s; }
      .n4 rect { animation: lit 4s ease-in-out infinite 3s; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
      @keyframes lit { 0%,100% { stroke-opacity: .45; fill: #141010; } 12% { stroke-opacity: 1; fill: #2a150b; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- status chip -->
  <g class="mono" transform="translate(860 44)">
    <rect width="280" height="30" rx="15" fill="#1a1210" stroke="#ff6a1a" stroke-opacity="0.35"/>
    <circle class="pulse" cx="20" cy="15" r="5" fill="#3ddc84"/>
    <text x="34" y="20" font-size="13" fill="#d9d2cc">building: passport_pipeline</text>
  </g>

  <!-- name -->
  <g class="mono">
    <text x="60" y="64" class="tag">// JOHANNESBURG · ZA</text>
    <text x="60" y="128" class="title">KANANELO MOFOKENG<tspan class="cursor" fill="#ff6a1a">_</tspan></text>
    <text x="60" y="166" class="sub">data engineer in the making <tspan class="dim">·</tspan> founder of FORGE <tspan class="dim">·</tspan> builder</text>
  </g>

  <!-- pipeline -->
  <path id="flow" d="M150 256 H1050" stroke="#ff6a1a" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8" fill="none"/>

  <g fill="#ffb347">
    <circle r="6" filter="url(#soft)"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#flow"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#flow"/></animateMotion></circle>
    <circle r="3" opacity="0.7"><animateMotion dur="4s" repeatCount="indefinite" begin="1.33s"><mpath href="#flow"/></animateMotion></circle>
    <circle r="2.5" opacity="0.5"><animateMotion dur="4s" repeatCount="indefinite" begin="2.66s"><mpath href="#flow"/></animateMotion></circle>
  </g>

  <g class="mono">
    <g class="node n1" transform="translate(80 236)"><rect width="140" height="40" rx="8"/><text x="70" y="25" text-anchor="middle">INGEST</text></g>
    <g class="node n2" transform="translate(370 236)"><rect width="140" height="40" rx="8"/><text x="70" y="25" text-anchor="middle">VALIDATE</text></g>
    <g class="node n3" transform="translate(660 236)"><rect width="140" height="40" rx="8"/><text x="70" y="25" text-anchor="middle">GOVERN</text></g>
    <g class="node n4" transform="translate(950 236)"><rect width="140" height="40" rx="8"/><text x="70" y="25" text-anchor="middle">SERVE</text></g>
    <text x="150" y="300" font-size="11" class="dim">raw</text>
    <text x="1020" y="300" font-size="11" class="dim">trusted</text>
  </g>
</svg>
